<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Control Horario</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Segoe UI, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            color: #333;
        }

        .button {
            width: 100%;
            padding: 60px;
            margin-bottom: 30px;
            border: none;
            border-radius: 24px;
            font-size: 3rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: .2s;
        }

        .button:active {
            transform: scale(.98);
        }

        .selecciones {
            background: #1976D2;
        }

        .cotton {
            background: #2E7D32;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CONTROL HORARIO</h1>

        <button class="button selecciones" onclick="goToSite('https://timenet-cp.gpisoftware.com/check/5d97be36-3063-4b75-a325-1c0117447566')">
            SELECCIONES
        </button>

        <button class="button cotton" onclick="goToSite('https://timenet-mcp.gpisoftware.com/08008c0d-edc1-4bf3-b552-a623ac86341d')">
            COTTON PROJECT
        </button>

    </div>

    <script>

        function goToSite(url) {
            sessionStorage.setItem("lastVisit", Date.now());
            window.location.href = url;
        }

    </script>

</body>

</html>
